<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickFinder | Discover Movies</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <a href="#" class="logo">Flick<span>Finder</span></a>
    </header>

    <main>
        <section class="search-section">
            <h1>Discover Your Next Favorite Movie</h1>
            <p>Search for movies, explore ratings, and find your next watch.</p>

            <form id="search-form" class="search-form">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search for a movie..."
                    aria-label="Movie title"
                    required
                >
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="movies-section">
            <h2 id="results-heading">Explore Movies</h2>

            <div id="movie-results" class="movie-grid">
                <!-- Movie cards will be added using JavaScript -->
            </div>

            <p id="status-message" role="status"></p>
        </section>
    </main>

    <div id="movie-modal" class="modal hidden">
        <div class="modal-content">
            <button
                id="close-modal"
                class="close-button"
                aria-label="Close movie details"
            >
                &times;
            </button>

            <div id="movie-details">
                <!-- Movie details will be added using JavaScript -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>
            FlickFinder &copy; 2026 |
            Discover your next favorite movie |
            By
            <a
                href="https://github.com/RanveerCodes247"
                target="_blank"
                rel="noopener noreferrer"
            >RanveerCodes247</a>
        </p>
    </footer>

</body>
</html>
